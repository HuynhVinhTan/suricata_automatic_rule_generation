name: Offline PCAP handoff safety

on:
  push:
    branches:
      - feat/pcap-ai-worker-integration
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner (no model or dataset downloads)
        run: python -m pip install pytest
      - name: Python syntax
        run: python -m compileall -q backend/pcap_handoff.py tests/test_phase3_pcap_handoff.py
      - name: Handoff tests (synthetic PCAPs, mocked SSH and worker)
        run: python -m pytest -q tests/test_phase3_pcap_handoff.py
