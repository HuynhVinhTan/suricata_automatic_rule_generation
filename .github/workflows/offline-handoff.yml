name: Offline PCAP handoff safety

on:
  push:
    branches:
      - feat/pcap-ai-worker-integration
      - feat/dataset-audit-rule-lifecycle
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner (no model or dataset downloads)
        run: python -m pip install pytest
      - name: Python syntax
        run: python -m compileall -q backend/pcap_handoff.py scripts/lab_http_96.py scripts/pcap_checksum_normalize.py tests/test_phase3_pcap_handoff.py tests/test_lab_http_96.py tests/test_pcap_checksum_normalize.py
      - name: Handoff tests (synthetic PCAPs, mocked SSH and worker)
        run: python -m pytest -q tests/test_phase3_pcap_handoff.py tests/test_lab_http_96.py tests/test_pcap_checksum_normalize.py

  dataset-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies (no model or dataset downloads)
        run: python -m pip install -e . pytest
      - name: Dataset and rule lifecycle gates
        run: python -m pytest -q
      - name: Compile and diff hygiene
        run: python -m compileall -q backend src scripts tests && git diff --check
