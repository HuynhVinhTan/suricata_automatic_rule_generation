%YAML 1.1
---
default-log-level: notice
runmode: workers

vars:
  address-groups:
    HOME_NET: "[192.168.10.0/24]"
    EXTERNAL_NET: "any"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    SSH_PORTS: "22"
    FTP_PORTS: "21"
    SIP_PORTS: "5060,5061"
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143,443,465,587,993,995]"
    SMTP_PORTS: "25,465,587,2525"
    DNS_SERVERS: "53"
    TEREDO_PORTS: "3544"
    DNP3_PORTS: "20000"
    MODBUS_PORTS: "502"
    ENIP_PORTS: "44818"

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      community-id: false
      types:
        - alert
        - flow
        - stats

af-packet:
  - interface: lo

app-layer:
  protocols:
    tls:
      enabled: yes
    http:
      enabled: yes
    dns:
      tcp:
        enabled: yes
      udp:
        enabled: yes

engine-analysis:
  rules-fast-pattern: yes
  rule-reload: false

rule-files:
  - suricata.rules

classification-file: classification.config
reference-config-file: reference.config
