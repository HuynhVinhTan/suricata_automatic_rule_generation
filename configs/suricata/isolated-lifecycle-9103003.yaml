%YAML 1.1
%TAG ! tag:yaml.org,2002:
---
vars:
  address-groups:
    HOME_NET: "[192.168.10.0/24]"
    EXTERNAL_NET: "any"
  port-groups:
    HTTP_PORTS: "80"
af-packet:
  - interface: lo
default-rule-path: /home/tanhv/suricata-rule-review/isolated-lifecycle-9103003/rules
rule-files:
  - active.rules
unix-command:
  enabled: yes
  filename: /home/tanhv/suricata-rule-review/isolated-lifecycle-9103003/runtime/lab-suricata.socket
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - flow
        - stats
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: no
    - file:
        enabled: yes
        filename: suricata.log
