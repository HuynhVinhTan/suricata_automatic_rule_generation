[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netids"
version = "0.1.0"
description = "ML-based network intrusion detection and Suricata rule generation research"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "cryptography>=42",
    "PyYAML>=6.0",
]

[project.scripts]
g3-lab-provision-key = "netids.g3_lab_cli:provision_main"
g3-lab-sign = "netids.g3_lab_cli:sign_main"
g3-lab-verify = "netids.g3_lab_cli:verify_main"

[project.optional-dependencies]
research = [
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["netids*"]
