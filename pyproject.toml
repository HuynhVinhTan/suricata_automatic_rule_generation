[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netids"
version = "0.1.0"
description = "ML-based network intrusion detection and Suricata rule generation research"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["netids*"]