input {

    beats {

        port => 5044

    }

}



filter {

    if [suricata][timestamp] {

        date {

            match => ["[suricata][timestamp]", "ISO8601"]

            target => "@timestamp"

        }

    }

}



output {

    elasticsearch {

        hosts => ["http://elasticsearch:9200"]



        index => "suricata-eve-%{+YYYY.MM.dd}"



        data_stream => false

        ilm_enabled => false

        manage_template => false

    }

}
